version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:

    #set config database
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mydb
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
      
    ports:
    #<External-Port> : <InDocker-Port>
      - "3307:3306"
    volumes:
    #Keep-SQL-Data-In-This-Path
      - mysql_data:/var/lib/mysql

  web:
    build: .
    container_name: node_web
    command: npx nodemon -L server.js
    ports:
    #server port
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      - mysql

volumes:
  mysql_data: