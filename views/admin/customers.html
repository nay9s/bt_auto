<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BT Auto Service - ลูกค้า</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f8f9fa;
        }

        .sidebar-active {
            background: linear-gradient(90deg, #5EEAD4 0%, #4ADE80 100%);
            color: white !important;
        }

        #sidebar {
            transition: transform 0.3s ease-in-out;
        }

        @media (max-width: 1024px) {
            .sidebar-hidden {
                transform: translateX(-100%);
            }

            main {
                margin-left: 0 !important;
            }
        }

        #customerTableBody td {
            font-size: 18px;
        }

        @media (min-width: 1024px) {
            #customerTableBody td {
                font-size: 21px;
            }
        }

        .page-active {
            background-color: #22c55e !important;
            color: white !important;
            font-weight: bold;
        }
    </style>
</head>

<body class="flex min-h-screen relative overflow-x-hidden">

    <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-20 hidden lg:hidden"></div>

    <aside id="sidebar"
        class="w-80 bg-white border-r flex flex-col fixed h-full shadow-sm z-30 sidebar-hidden lg:translate-x-0">
        <div class="p-6">
            <div class="flex items-center justify-between mb-10">
                <div class="flex items-center gap-3">
                    <div class="bg-white border p-1 rounded-lg shadow-sm">
                        <img src="main/logo.png" class="w-12 h-12 lg:w-16 lg:h-16" alt="Logo">
                    </div>
                    <div>
                        <h1 class="font-bold text-green-600 text-xl lg:text-2xl leading-tight">อู่บีที ออโต้เซอร์วิส
                        </h1>
                        <p class="text-[14px] lg:text-[16px] text-red-600 font-bold tracking-tighter uppercase">BT Auto
                            Service</p>
                    </div>
                </div>
                <button onclick="toggleSidebar()" class="lg:hidden text-gray-400 p-2 text-2xl">✕</button>
            </div>

            <nav class="space-y-1">
                <p class="text-[18px] lg:text-[20px] text-black-400 font-bold mb-4 px-3 uppercase tracking-wider">
                    เมนูบริหาร</p>
                <a href="dashbord.html"
                    class="flex items-center gap-3 p-3 text-gray-500 hover:bg-gray-50 rounded-xl transition text-2xl">
                    <span class="w-10 h-10 flex items-center justify-center shrink-0"><img src="main/dashboard.png"
                            class="w-7 h-7 object-contain"></span> แดชบอร์ด
                </a>
                <a href="finance.html"
                    class="flex items-center gap-3 p-3 text-gray-500 hover:bg-gray-50 rounded-xl transition text-2xl">
                    <span class="w-10 h-10 flex items-center justify-center shrink-0"><img src="main/finance.png"
                            class="w-9 h-9 object-contain"></span> การเงิน
                </a>
                <a href="cars.html"
                    class="flex items-center gap-3 p-3 text-gray-500 hover:bg-gray-50 rounded-xl transition text-2xl">
                    <span class="w-10 h-10 flex items-center justify-center shrink-0"><img src="main/car.png"
                            class="w-9 h-9 object-contain"></span> รถยนต์
                </a>
                <a href="customers.html"
                    class="sidebar-active flex items-center gap-3 p-3 text-gray-500 hover:bg-gray-50 rounded-xl transition text-2xl">
                    <span class="w-10 h-10 flex items-center justify-center shrink-0"><img src="main/group (1).png"
                            class="w-9 h-9 object-contain"></span> ลูกค้า
                </a>
                <a href="workorders.html"
                    class="flex items-center gap-3 p-3 text-gray-500 hover:bg-gray-50 rounded-xl transition text-2xl">
                    <span class="w-10 h-10 flex items-center justify-center shrink-0"><img src="main/order.png"
                            class="w-9 h-9 object-contain"></span> ใบสั่งซ่อม
                </a>
                <a href="inventory.html"
                    class="flex items-center gap-3 p-3 text-gray-500 hover:bg-gray-50 rounded-xl transition text-2xl">
                    <span class="w-10 h-10 flex items-center justify-center shrink-0"><img src="main/stock.png"
                            class="w-9 h-9 object-contain"></span> คลังสินค้า
                </a>
            </nav>
        </div>
    </aside>

    <main class="flex-1 lg:ml-80 pt-0 pl-0 pr-0 pb-10 w-full overflow-x-hidden">
        <header class="w-full relative mb-8">
            <div
                class="relative z-10 bg-white/90 backdrop-blur-md p-6 lg:p-8 border-b border-gray-200 shadow-lg flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-4 w-full md:w-auto">
                    <button onclick="toggleSidebar()"
                        class="lg:hidden bg-white p-2 rounded-lg border shadow-sm text-gray-600">☰</button>
                    <div>
                        <h2 class="text-2xl lg:text-3xl font-bold text-gray-800">จัดการข้อมูลลูกค้า</h2>
                        <p class="text-gray-500 text-lg lg:text-xl mt-1">จัดการฐานข้อมูลลูกค้าและประวัติการใช้บริการ</p>
                    </div>
                </div>

                <div class="flex items-center gap-4 w-full md:w-auto justify-between md:justify-end">
                    <button onclick="openModal()"
                        class="bg-green-600 text-white px-4 lg:px-6 py-3 rounded-xl font-bold text-lg lg:text-xl flex items-center gap-2 hover:bg-green-700 transition shadow-lg active:scale-95">
                        <span>+ เพิ่มลูกค้าใหม่</span>
                    </button>
                    <div class="flex items-center gap-3">
                        <div class="text-right hidden sm:block">
                            <p class="text-lg lg:text-xl font-bold text-gray-800">สมชาย มั่นคง</p>
                            <p class="text-[17px] text-gray-400 font-medium">เจ้าของอู่</p>
                        </div>
                        <div
                            class="w-12 h-12 lg:w-14 lg:h-14 rounded-full border-4 border-white shadow-md bg-red-300 flex items-center justify-center text-white font-bold text-xl uppercase">
                            SM</div>
                    </div>
                </div>
            </div>
        </header>

        <div class="px-4 lg:px-10">
            <div
                class="bg-white p-4 lg:p-6 rounded-2xl border border-gray-100 shadow-sm mb-6 flex flex-col lg:flex-row justify-between items-stretch lg:items-center gap-4">
                <div class="relative w-full max-w-md">
                    <span class="absolute inset-y-0 left-3 flex items-center text-gray-400">
                        <img src="main/search.png" class="w-5 h-5">
                    </span>
                    <input type="text" id="customerSearch" placeholder="ค้นหาชื่อลูกค้า หรือ เบอร์โทร..."
                        class="text-lg lg:text-xl w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-green-400 outline-none transition-all">
                </div>

                <div class="flex flex-wrap gap-2 lg:gap-3">
                    <select id="statusFilter"
                        class="flex-1 lg:flex-none px-3 py-2.5 text-lg lg:text-xl bg-white border border-gray-200 rounded-xl text-gray-600 outline-none focus:ring-2 focus:ring-green-400 cursor-pointer">
                        <option value="all">ลูกค้าทั้งหมด</option>
                        <option value="high">ยอดใช้บริการสูง (฿5,000+)</option>
                        <option value="normal">ลูกค้าทั่วไป</option>
                    </select>
                    <button onclick="exportToExcel()"
                        class="flex-1 lg:flex-none flex justify-center items-center gap-2 px-4 py-2.5 border border-gray-200 rounded-xl text-gray-600 hover:bg-gray-50 transition text-lg lg:text-xl font-medium">
                        <img src="main/excel.png" class="w-5 h-5 object-contain">
                        <span>ส่งออก Excel</span>
                    </button>
                </div>
            </div>

            <div class="bg-white rounded-2xl border border-gray-300 shadow-sm overflow-hidden">
                <div class="overflow-x-auto w-full">
                    <table class="w-full text-center min-w-[1200px]">
                        <thead class="bg-gray-300 text-gray-800 text-xl uppercase">
                            <tr>
                                <th class="px-6 py-4 font-medium text-left pl-10">ชื่อ-นามสกุล</th>
                                <th class="px-6 py-4 font-medium">อีเมล</th>
                                <th class="px-6 py-4 font-medium">เบอร์โทร</th>
                                <th class="px-6 py-4 font-medium text-left">ที่อยู่</th>
                                <th class="px-6 py-4 font-medium">จำนวนรถ</th>
                                <th class="px-6 py-4 font-medium">ยอดรวม</th>
                                <th class="px-6 py-4 font-medium">ล่าสุด</th>
                            </tr>
                        </thead>
                        <tbody id="customerTableBody" class="divide-y divide-gray-100 text-gray-700">
                        </tbody>
                    </table>
                </div>

                <div
                    class="px-6 py-4 bg-gray-50 flex flex-col sm:flex-row justify-between items-center gap-4 text-sm text-gray-500 border-t border-gray-100">
                    <p id="rowCountDisplay" class="text-xl font-medium text-gray-500">กำลังโหลดรายการ...</p>
                    <div class="flex gap-1" id="paginationControls">
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="addCustomerModal"
        class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
        <div id="modalContent"
            class="bg-white w-full max-w-xl rounded-[2rem] shadow-2xl overflow-hidden p-8 scale-95 opacity-0 transition-all duration-200">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold text-gray-800">เพิ่มข้อมูลลูกค้า</h3>
                <button onclick="closeModal()" class="text-gray-400 text-3xl hover:text-gray-600">&times;</button>
            </div>
            <form id="addCustomerForm" class="space-y-4">
                <input type="text" name="name" placeholder="ชื่อ-นามสกุล" required
                    class="text-lg w-full px-4 py-3 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-green-400">
                <input type="email" name="email" placeholder="อีเมล" required
                    class="text-lg w-full px-4 py-3 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-green-400">
                <input type="tel" name="phone" placeholder="เบอร์โทรศัพท์" required
                    class="text-lg w-full px-4 py-3 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-green-400">
                <textarea name="address" placeholder="ที่อยู่" required
                    class="text-lg w-full px-4 py-3 rounded-xl border border-gray-200 outline-none h-24 focus:ring-2 focus:ring-green-400"></textarea>
                <button type="submit"
                    class="w-full py-4 bg-green-600 text-white rounded-xl font-bold text-xl hover:bg-green-700 transition shadow-lg active:scale-95">บันทึกข้อมูล</button>
            </form>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('sidebar-hidden');
            overlay.classList.toggle('hidden');
        }

        const allCustomers = [
            { name: 'John Smith', email: 'john.s@gmail.com', phone: '081-234-5678', address: '123 Main st, City', carCount: 2, totalSpend: 4500, lastService: '25-11-2025' },
            { name: 'Sarah Johnson', email: 'sarah.j@gmail.com', phone: '092-876-5432', address: '456 Oak Ave', carCount: 1, totalSpend: 2800, lastService: '25-11-2025' },
            { name: 'Mike Wilson', email: 'mike.w@gmail.com', phone: '085-998-8776', address: '789 Pine Rd', carCount: 3, totalSpend: 8200, lastService: '26-11-2025' },
            { name: 'Emily Brown', email: 'emily.b@gmail.com', phone: '098-456-7890', address: '321 Elm St', carCount: 1, totalSpend: 1950, lastService: '26-11-2025' },
            { name: 'สมชาย มั่นคง', email: 'somchai@email.com', phone: '081-000-1111', address: 'Bangkok', carCount: 5, totalSpend: 12500, lastService: '27-01-2026' },
            { name: 'วิชัย มั่นคง', email: 'wichai@email.com', phone: '084-555-6666', address: 'Mae Ka', carCount: 2, totalSpend: 3400, lastService: '15-12-2025' },
            { name: 'นารี รุ่งเรือง', email: 'naree@email.com', phone: '089-111-2222', address: 'Phayao', carCount: 1, totalSpend: 1200, lastService: '10-01-2026' },
            { name: 'ปิติ รักษ์ดี', email: 'piti@email.com', phone: '082-333-4444', address: 'Chiang Mai', carCount: 3, totalSpend: 6700, lastService: '05-01-2026' },
            { name: 'มานะ มานี', email: 'mana@email.com', phone: '086-777-8888', address: 'Rayong', carCount: 4, totalSpend: 9800, lastService: '20-01-2026' }
        ];

        let currentPage = 1;
        const rowsPerPage = 4;

        function openModal() {
            const modal = document.getElementById('addCustomerModal');
            const content = document.getElementById('modalContent');
            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('addCustomerModal');
            const content = document.getElementById('modalContent');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); }, 200);
        }

        document.getElementById('addCustomerForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const newCust = {
                name: this.name.value,
                email: this.email.value,
                phone: this.phone.value,
                address: this.address.value,
                carCount: 0,
                totalSpend: 0,
                lastService: new Date().toLocaleDateString('th-TH')
            };
            allCustomers.unshift(newCust);
            currentPage = 1;
            renderTable(1);
            closeModal();
            this.reset();
            alert('บันทึกข้อมูลคุณ ' + newCust.name + ' เรียบร้อยแล้ว!');
        });

        function renderTable(page) {
            const search = document.getElementById('customerSearch').value.toLowerCase();
            const statusVal = document.getElementById('statusFilter').value;

            const filtered = allCustomers.filter(c => {
                const matchesSearch = c.name.toLowerCase().includes(search) || c.phone.includes(search);
                let matchesStatus = true;
                if (statusVal === 'high') matchesStatus = c.totalSpend >= 5000;
                if (statusVal === 'normal') matchesStatus = c.totalSpend < 5000;
                return matchesSearch && matchesStatus;
            });

            const start = (page - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const paginated = filtered.slice(start, end);

            const tbody = document.getElementById('customerTableBody');
            tbody.innerHTML = '';

            paginated.forEach(c => {
                tbody.innerHTML += `
                    <tr class="hover:bg-green-50 transition cursor-pointer" onclick="location.href='customer_detail.html?name=${c.name}'">
                        <td class="px-6 py-4 text-left pl-10 font-bold text-gray-800">${c.name}</td>
                        <td class="px-6 py-4">${c.email}</td>
                        <td class="px-6 py-4 font-mono">${c.phone}</td>
                        <td class="px-6 py-4 text-left text-sm text-gray-500">${c.address}</td>
                        <td class="px-6 py-4">${c.carCount}</td>
                        <td class="px-6 py-4 font-bold text-green-600">฿${c.totalSpend.toLocaleString()}</td>
                        <td class="px-6 py-4 text-sm">${c.lastService}</td>
                    </tr>
                `;
            });

            renderPagination(filtered.length);
            document.getElementById('rowCountDisplay').innerText = `แสดง ${filtered.length > 0 ? start + 1 : 0} ถึง ${Math.min(end, filtered.length)} จาก ${filtered.length} รายการ`;
        }

        function renderPagination(totalItems) {
            const pageCount = Math.ceil(totalItems / rowsPerPage);
            const controls = document.getElementById('paginationControls');
            controls.innerHTML = '';
            if (pageCount <= 1) return;

            const createBtn = (text, active, onClick) => {
                const btn = document.createElement('button');
                btn.innerText = text;
                btn.className = `px-3 py-1 border border-gray-200 rounded-lg hover:bg-white transition text-xl ${active ? 'page-active' : 'hover:bg-white'}`;
                btn.onclick = onClick;
                return btn;
            };

            controls.appendChild(createBtn('ย้อนกลับ', false, () => { if (currentPage > 1) { currentPage--; renderTable(currentPage); } }));
            for (let i = 1; i <= pageCount; i++) {
                controls.appendChild(createBtn(i, i === currentPage, () => { currentPage = i; renderTable(i); }));
            }
            controls.appendChild(createBtn('ถัดไป', false, () => { if (currentPage < pageCount) { currentPage++; renderTable(currentPage); } }));
        }

        // --- เพิ่มฟังก์ชันส่งออก Excel (CSV) ---
        function exportToExcel() {
            if (allCustomers.length === 0) {
                alert("ไม่มีข้อมูลสำหรับส่งออก");
                return;
            }

            // สร้างหัวข้อ Column
            let csvContent = "\uFEFF"; // ใส่ BOM เพื่อให้อ่านภาษาไทยใน Excel ได้
            csvContent += "ชื่อ-นามสกุล,อีเมล,เบอร์โทร,ที่อยู่,จำนวนรถ,ยอดรวมยอดใช้บริการ,เข้าบริการล่าสุด\n";

            // วนลูปเอาข้อมูลจาก Array allCustomers มาใส่
            allCustomers.forEach(c => {
                let row = `"${c.name}","${c.email}","${c.phone}","${c.address.replace(/\n/g, ' ')}",${c.carCount},${c.totalSpend},"${c.lastService}"`;
                csvContent += row + "\n";
            });

            // สร้างไฟล์ดาวน์โหลด
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", "รายชื่อลูกค้า_BTAutoService.csv");
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        document.getElementById('customerSearch').addEventListener('keyup', () => { currentPage = 1; renderTable(1); });
        document.getElementById('statusFilter').addEventListener('change', () => { currentPage = 1; renderTable(1); });

        renderTable(1);
    </script>
</body>

</html>
