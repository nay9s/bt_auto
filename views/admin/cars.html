<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BT Auto Service - รายการรถยนต์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f8f9fa;
        }

        .sidebar-active {
            background: linear-gradient(90deg, #5EEAD4 0%, #4ADE80 100%);
            color: white !important;
        }

        .plate-number {
            background-color: #eee;
            border: 2px solid #ccc;
            border-radius: 8px;
            padding: 4px 12px;
            font-weight: 600;
            color: #555;
            display: inline-block;
            min-width: 100px;
            text-align: center;
        }

        #sidebar {
            transition: transform 0.3s ease-in-out;
        }

        @media (max-width: 1024px) {
            .sidebar-hidden {
                transform: translateX(-100%);
            }

            main {
                margin-left: 0 !important;
            }
        }

        #carTableBody td {
            font-size: 18px;
        }

        @media (min-width: 1024px) {
            #carTableBody td {
                font-size: 21px;
            }
        }

        .page-active {
            background-color: #22c55e !important;
            color: white !important;
            font-weight: bold;
        }
    </style>
</head>

<body class="flex min-h-screen relative overflow-x-hidden">

    <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-20 hidden lg:hidden"></div>

    <aside id="sidebar"
        class="w-80 bg-white border-r flex flex-col fixed h-full shadow-sm z-30 sidebar-hidden lg:translate-x-0">
        <div class="p-6">
            <div class="flex items-center justify-between mb-10">
                <div class="flex items-center gap-3">
                    <div class="bg-white border p-1 rounded-lg shadow-sm">
                        <img src="main/logo.png" class="w-12 h-12 lg:w-16 lg:h-16" alt="Logo">
                    </div>
                    <div>
                        <h1 class="font-bold text-green-600 text-xl lg:text-2xl leading-tight">อู่บีที ออโต้เซอร์วิส
                        </h1>
                        <p class="text-[14px] lg:text-[16px] text-red-600 font-bold tracking-tighter uppercase">BT Auto
                            Service</p>
                    </div>
                </div>
                <button onclick="toggleSidebar()" class="lg:hidden text-gray-400 p-2 text-2xl">✕</button>
            </div>

            <nav class="space-y-1">
                <p class="text-[18px] lg:text-[20px] text-black-400 font-bold mb-4 px-3 uppercase tracking-wider">
                    เมนูบริหาร</p>
                <a href="dashbord.html"
                    class="flex items-center gap-3 p-3 text-gray-500 hover:bg-gray-50 rounded-xl transition text-2xl">
                    <span class="w-10 h-10 flex items-center justify-center shrink-0"><img src="main/dashboard.png"
                            class="w-7 h-7 object-contain"></span> แดชบอร์ด
                </a>
                <a href="finance.html"
                    class="flex items-center gap-3 p-3 text-gray-500 hover:bg-gray-50 rounded-xl transition text-2xl">
                    <span class="w-10 h-10 flex items-center justify-center shrink-0"><img src="main/finance.png"
                            class="w-9 h-9 object-contain"></span> การเงิน
                </a>
                <a href="cars.html"
                    class="sidebar-active flex items-center gap-3 p-3 text-gray-500 hover:bg-gray-50 rounded-xl transition text-2xl">
                    <span class="w-10 h-10 flex items-center justify-center shrink-0"><img src="main/carg.png"
                            class="w-9 h-9 object-contain"></span> รถยนต์
                </a>
                <a href="customers.html"
                    class="flex items-center gap-3 p-3 text-gray-500 hover:bg-gray-50 rounded-xl transition text-2xl">
                    <span class="w-10 h-10 flex items-center justify-center shrink-0"><img src="main/group.png"
                            class="w-9 h-9 object-contain"></span> ลูกค้า
                </a>
                <a href="workorders.html"
                    class="flex items-center gap-3 p-3 text-gray-500 hover:bg-gray-50 rounded-xl transition text-2xl">
                    <span class="w-10 h-10 flex items-center justify-center shrink-0"><img src="main/order.png"
                            class="w-9 h-9 object-contain"></span> ใบสั่งซ่อม
                </a>
                <a href="inventory.html"
                    class="flex items-center gap-3 p-3 text-gray-500 hover:bg-gray-50 rounded-xl transition text-2xl">
                    <span class="w-10 h-10 flex items-center justify-center shrink-0"><img src="main/stock.png"
                            class="w-9 h-9 object-contain"></span> คลังสินค้า
                </a>
            </nav>
        </div>
    </aside>

    <main class="flex-1 lg:ml-80 pt-0 pl-0 pr-0 pb-10 w-full overflow-x-hidden">

        <header class="w-full relative mb-8 bg-white shadow-md border-b border-gray-200">
            <div class="p-6 lg:p-8 flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-4 w-full md:w-auto">
                    <button onclick="toggleSidebar()"
                        class="lg:hidden bg-white p-2 rounded-lg border shadow-sm text-gray-600">☰</button>
                    <div>
                        <h2 class="text-2xl lg:text-3xl font-bold text-gray-800">รายการรถยนต์</h2>
                        <p class="text-gray-500 text-lg lg:text-xl mt-1 font-medium">จัดการรถยนต์ทั้งหมดในอู่</p>
                    </div>
                </div>

                <div class="flex items-center gap-4 w-full md:w-auto justify-between md:justify-end">
                    <button onclick="openModal()"
                        class="bg-green-600 text-white px-4 lg:px-6 py-3 rounded-xl font-bold text-lg lg:text-xl flex items-center gap-2 hover:bg-green-700 transition shadow-lg active:scale-95">
                        <span>+ เพิ่มรถยนต์</span>
                    </button>
                    <div class="flex items-center justify-between lg:justify-end w-full lg:w-auto gap-4">
                        <input type="date" id="dashboardDatePicker"
                            class="bg-white border px-3 py-2 rounded-xl shadow-sm text-gray-600 text-lg lg:text-xl cursor-pointer focus:outline-none"
                            value="2023-10-24" onchange="updateDashboardDate(this.value)">
                        <div class="flex items-center gap-3">
                            <div class="text-right hidden sm:block">
                                <p class="text-lg lg:text-xl font-bold text-gray-800">สมชาย มั่นคง</p>
                                <p class="text-[15px] lg:text-[17px] text-gray-400 font-medium">เจ้าของอู่</p>
                            </div>
                            <div
                                class="w-12 h-12 lg:w-14 lg:h-14 rounded-full border-4 border-white shadow-md bg-red-300 flex items-center justify-center text-white font-bold text-xl uppercase">
                                SM</div>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <div class="px-4 lg:px-10">
            <div
                class="bg-white p-4 lg:p-6 rounded-2xl border border-gray-100 shadow-sm mb-6 flex flex-col lg:flex-row justify-between items-stretch lg:items-center gap-4">
                <div class="relative w-full max-w-md">
                    <span class="absolute inset-y-0 left-3 flex items-center text-gray-400"><img src="main/search.png"
                            class="w-5 h-5"></span>
                    <input type="text" id="carSearch" placeholder="ค้นหาชื่อรุ่น หรือ ทะเบียนรถ..."
                        class="text-lg lg:text-xl w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-green-400 outline-none transition-all">
                </div>

                <div class="flex flex-wrap gap-2 lg:gap-3">
                    <select id="statusFilter"
                        class="flex-1 lg:flex-none px-3 py-2.5 text-lg lg:text-xl bg-white border border-gray-200 rounded-xl text-gray-600 outline-none focus:ring-2 focus:ring-green-400 cursor-pointer">
                        <option value="all">สถานะทั้งหมด</option>
                        <option value="พร้อมใช้งาน">พร้อมใช้งาน</option>
                        <option value="กำลังซ่อม">กำลังซ่อม</option>
                        <option value="เสร็จสิ้นแล้ว">เสร็จสิ้นแล้ว</option>
                    </select>

                    <button onclick="exportToExcel()"
                        class="flex-1 lg:flex-none flex justify-center items-center gap-2 px-4 py-2.5 border border-gray-200 rounded-xl text-gray-600 hover:bg-gray-50 transition shadow-sm active:bg-gray-100 text-lg lg:text-xl font-medium">
                        <img src="main/excel.png" class="w-5 h-5 object-contain" alt="Excel">
                        <span>Excel</span>
                    </button>
                </div>
            </div>

            <div class="bg-white rounded-2xl border border-gray-300 shadow-sm overflow-hidden">
                <div class="overflow-x-auto w-full">
                    <table class="w-full text-center min-w-[1000px]" id="carTable">
                        <thead class="bg-gray-300 text-gray-800 text-xl uppercase font-bold">
                            <tr>
                                <th class="px-6 py-4 font-medium text-left pl-10">ยี่ห้อ & รุ่น</th>
                                <th class="px-6 py-4 font-medium">ปี</th>
                                <th class="px-6 py-4 font-medium">ทะเบียนรถ</th>
                                <th class="px-6 py-4 font-medium">หมายเลขตัวถัง (VIN)</th>
                                <th class="px-6 py-4 font-medium">เจ้าของ</th>
                                <th class="px-6 py-4 font-medium text-center">สถานะ</th>
                                <th class="px-6 py-4 font-medium">เข้าบริการล่าสุด</th>
                            </tr>
                        </thead>
                        <tbody id="carTableBody" class="divide-y divide-gray-100 text-gray-700">
                        </tbody>
                    </table>
                </div>

                <div
                    class="px-6 py-4 bg-gray-50 flex flex-col sm:flex-row justify-between items-center gap-4 text-sm text-gray-500 border-t border-gray-100">
                    <p id="rowCountDisplay" class="text-xl font-medium text-gray-500">กำลังโหลดรายการ...</p>
                    <div class="flex gap-1" id="paginationControls"></div>
                </div>
            </div>
        </div>
    </main>

    <div id="addCarModal"
        class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
        <div id="modalContent"
            class="bg-white w-full max-w-2xl rounded-[2rem] shadow-2xl overflow-hidden p-8 scale-95 opacity-0 transition-all duration-200">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold text-gray-800">เพิ่มข้อมูลรถยนต์ใหม่</h3>
                <button onclick="closeModal()" class="text-gray-400 text-3xl hover:text-gray-600">&times;</button>
            </div>
            <form id="addCarForm" class="grid grid-cols-1 sm:grid-cols-2 gap-4 lg:gap-6">
                <div><label class="block text-gray-700 font-bold mb-1 text-lg">ยี่ห้อรถยนต์</label><input type="text"
                        name="brand" required
                        class="w-full px-4 py-2 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-green-400">
                </div>
                <div><label class="block text-gray-700 font-bold mb-1 text-lg">รุ่น (Model)</label><input type="text"
                        name="model" required
                        class="w-full px-4 py-2 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-green-400">
                </div>
                <div><label class="block text-gray-700 font-bold mb-1 text-lg">ปีที่ผลิต</label><input type="number"
                        name="year" required
                        class="w-full px-4 py-2 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-green-400">
                </div>
                <div><label class="block text-gray-700 font-bold mb-1 text-lg">ทะเบียนรถ</label><input type="text"
                        name="plate" required
                        class="w-full px-4 py-2 rounded-xl border border-gray-200 outline-none uppercase focus:ring-2 focus:ring-green-400 font-mono">
                </div>
                <div class="col-span-1 sm:col-span-2"><label
                        class="block text-gray-700 font-bold mb-1 text-lg">เลขตัวถัง (VIN)</label><input type="text"
                        name="vin" required
                        class="w-full px-4 py-2 rounded-xl border border-gray-200 outline-none uppercase focus:ring-2 focus:ring-green-400 font-mono">
                </div>
                <div class="col-span-1 sm:col-span-2 border-t border-dashed border-gray-100 pt-4"><label
                        class="block text-gray-700 font-bold mb-1 text-lg">ชื่อเจ้าของรถ</label><input type="text"
                        name="owner" required
                        class="w-full px-4 py-2 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-green-400">
                </div>
                <button type="submit"
                    class="col-span-1 sm:col-span-2 mt-4 py-3 bg-green-600 text-white rounded-xl font-bold text-xl hover:bg-green-700 transition shadow-lg active:scale-95">บันทึกข้อมูลรถยนต์</button>
            </form>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('sidebar-hidden');
            overlay.classList.toggle('hidden');
        }

        const allCars = [
            { brand: 'Toyota', model: 'Camry', type: 'sedan', year: 2020, plate: 'ABC-1234', vin: '1HGBH41JXMN109186', owner: 'John Smith', status: 'พร้อมใช้งาน', lastService: '25-11-2025' },
            { brand: 'Honda', model: 'Civic', type: 'sedan', year: 2019, plate: 'XYZ-5678', vin: '2HGFG12848H502460', owner: 'Sarah Johnson', status: 'กำลังซ่อม', lastService: '25-11-2025' },
            { brand: 'Ford', model: 'F-150', type: 'Truck', year: 2021, plate: 'DEF-9012', vin: '1FTFW1ET5TFC10312', owner: 'Milk Wilson', status: 'เสร็จสิ้นแล้ว', lastService: '26-11-2025' },
            { brand: 'Chevrolet', model: 'Silverado', type: 'Truck', year: 2022, plate: 'GHI-3456', vin: '1GCUYGEL5NZ123456', owner: 'Emily Brown', status: 'พร้อมใช้งาน', lastService: '26-11-2025' },
            { brand: 'BMW', model: 'Series 5', type: 'sedan', year: 2023, plate: 'กข-999', vin: 'WBA5341000L123456', owner: 'สมชาย ใจดี', status: 'กำลังซ่อม', lastService: '27-01-2026' },
            { brand: 'Tesla', model: 'Model 3', type: 'electric', year: 2022, plate: 'EV-101', vin: '5YJ3E1EB2LF123456', owner: 'มานะ มานี', status: 'พร้อมใช้งาน', lastService: '20-01-2026' },
            { brand: 'Isuzu', model: 'D-Max', type: 'Truck', year: 2021, plate: 'ผห-4455', vin: 'MP1TF57G0L123456', owner: 'วิชัย มั่นคง', status: 'เสร็จสิ้นแล้ว', lastService: '15-12-2025' },
            { brand: 'Mazda', model: 'CX-5', type: 'SUV', year: 2020, plate: '7กก-123', vin: 'JM7KF24L0L123456', owner: 'นารี รุ่งเรือง', status: 'พร้อมใช้งาน', lastService: '10-01-2026' },
            { brand: 'Nissan', model: 'Almera', type: 'sedan', year: 2021, plate: '9กข-888', vin: 'MNTCC12345L123456', owner: 'ปิติ รักษ์ดี', status: 'พร้อมใช้งาน', lastService: '05-01-2026' }
        ];

        let currentPage = 1;
        const rowsPerPage = 4;

        function openModal() {
            const modal = document.getElementById('addCarModal');
            const content = document.getElementById('modalContent');
            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            const content = document.getElementById('modalContent');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { document.getElementById('addCarModal').classList.add('hidden'); }, 200);
        }

        document.getElementById('addCarForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const newCar = {
                brand: this.brand.value,
                model: this.model.value,
                type: 'เพิ่มใหม่',
                year: this.year.value,
                plate: this.plate.value,
                vin: this.vin.value,
                owner: this.owner.value,
                status: 'พร้อมใช้งาน',
                lastService: new Date().toLocaleDateString('th-TH')
            };
            allCars.unshift(newCar);
            currentPage = 1;
            renderTable(1);
            closeModal();
            this.reset();
            alert('บันทึกข้อมูลรถ ' + newCar.plate + ' เรียบร้อยแล้ว!');
        });

        function renderTable(page) {
            const search = document.getElementById('carSearch').value.toLowerCase();
            const statusVal = document.getElementById('statusFilter').value;

            const filtered = allCars.filter(car => {
                const matchesSearch = car.brand.toLowerCase().includes(search) || car.model.toLowerCase().includes(search) || car.plate.toLowerCase().includes(search);
                const matchesStatus = statusVal === "all" || car.status === statusVal;
                return matchesSearch && matchesStatus;
            });

            const start = (page - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const paginated = filtered.slice(start, end);

            const tbody = document.getElementById('carTableBody');
            tbody.innerHTML = '';

            paginated.forEach(car => {
                const statusClass = car.status === 'พร้อมใช้งาน' ? 'bg-green-50 text-green-600' : (car.status === 'กำลังซ่อม' ? 'bg-blue-50 text-blue-600' : 'bg-gray-50 text-gray-400');
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 transition cursor-pointer">
                        <td class="px-6 py-5 text-left pl-10 font-bold text-gray-800">${car.brand} ${car.model}</td>
                        <td class="px-6 py-5">${car.year}</td>
                        <td class="px-6 py-5"><span class="plate-number">${car.plate}</span></td>
                        <td class="px-6 py-5 font-mono text-base text-gray-500">${car.vin}</td>
                        <td class="px-6 py-5 font-medium">${car.owner}</td>
                        <td class="px-6 py-5"><span class="px-3 py-1 rounded-full font-bold border ${statusClass}">${car.status}</span></td>
                        <td class="px-6 py-5 text-gray-500">${car.lastService}</td>
                    </tr>
                `;
            });

            renderPagination(filtered.length);
            document.getElementById('rowCountDisplay').innerText = `แสดง ${filtered.length > 0 ? start + 1 : 0} ถึง ${Math.min(end, filtered.length)} จาก ${filtered.length} รายการ`;
        }

        function renderPagination(totalItems) {
            const pageCount = Math.ceil(totalItems / rowsPerPage);
            const controls = document.getElementById('paginationControls');
            controls.innerHTML = '';
            if (pageCount <= 1) return;

            const createBtn = (text, active, onClick) => {
                const btn = document.createElement('button');
                btn.innerText = text;
                btn.className = `px-4 py-1 border border-gray-200 rounded-lg transition text-xl ${active ? 'page-active' : 'hover:bg-white'}`;
                btn.onclick = onClick;
                return btn;
            };

            controls.appendChild(createBtn('ย้อนกลับ', false, () => { if (currentPage > 1) { currentPage--; renderTable(currentPage); } }));
            for (let i = 1; i <= pageCount; i++) {
                controls.appendChild(createBtn(i, i === currentPage, () => { currentPage = i; renderTable(i); }));
            }
            controls.appendChild(createBtn('ถัดไป', false, () => { if (currentPage < pageCount) { currentPage++; renderTable(currentPage); } }));
        }

        function exportToExcel() {
            if (allCars.length === 0) { alert("ไม่มีข้อมูล"); return; }
            let csvContent = "\uFEFF";
            csvContent += "ยี่ห้อ,รุ่น,ปี,ทะเบียน,VIN,เจ้าของ,สถานะ,บริการล่าสุด\n";
            allCars.forEach(c => {
                csvContent += `"${c.brand}","${c.model}",${c.year},"${c.plate}","${c.vin}","${c.owner}","${c.status}","${c.lastService}"\n`;
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = "รายการรถยนต์_BTAuto.csv";
            link.click();
        }

        document.getElementById('carSearch').addEventListener('keyup', () => { currentPage = 1; renderTable(1); });
        document.getElementById('statusFilter').addEventListener('change', () => { currentPage = 1; renderTable(1); });

        renderTable(1);
    </script>
</body>

</html>
