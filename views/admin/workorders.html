<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BT Auto Service - ใบสั่งซ่อม</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f8f9fa;
        }

        .sidebar-active {
            background: linear-gradient(90deg, #5EEAD4 0%, #4ADE80 100%);
            color: white !important;
        }

        #sidebar {
            transition: transform 0.3s ease-in-out;
        }

        @media (max-width: 1024px) {
            .sidebar-hidden {
                transform: translateX(-100%);
            }

            main {
                margin-left: 0 !important;
            }
        }

        #workOrderTableBody td {
            font-size: 18px;
        }

        @media (min-width: 1024px) {
            #workOrderTableBody td {
                font-size: 21px;
            }
        }

        .page-active {
            background-color: #22c55e !important;
            color: white !important;
            font-weight: bold;
        }
    </style>
</head>

<body class="flex min-h-screen relative overflow-x-hidden">

    <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-20 hidden lg:hidden"></div>

    <aside id="sidebar"
        class="w-80 bg-white border-r flex flex-col fixed h-full shadow-sm z-30 sidebar-hidden lg:translate-x-0">
        <div class="p-6">
            <div class="flex items-center justify-between mb-10">
                <div class="flex items-center gap-3">
                    <div class="bg-white border p-1 rounded-lg shadow-sm">
                        <img src="main/logo.png" class="w-12 h-12 lg:w-16 lg:h-16" alt="Logo">
                    </div>
                    <div>
                        <h1 class="font-bold text-green-600 text-xl lg:text-2xl leading-tight">อู่บีที ออโต้เซอร์วิส
                        </h1>
                        <p class="text-[14px] lg:text-[16px] text-red-600 font-bold tracking-tighter uppercase">BT Auto
                            Service</p>
                    </div>
                </div>
                <button onclick="toggleSidebar()" class="lg:hidden text-gray-400 p-2 text-2xl">✕</button>
            </div>

            <nav class="space-y-1">
                <p class="text-[18px] lg:text-[20px] text-black-400 font-bold mb-4 px-3 uppercase tracking-wider">
                    เมนูบริหาร</p>
                <a href="dashbord.html"
                    class="flex items-center gap-3 p-3 text-gray-500 hover:bg-gray-50 rounded-xl transition text-2xl">
                    <span class="w-10 h-10 flex items-center justify-center shrink-0"><img src="main/dashboard.png"
                            class="w-7 h-7 object-contain"></span> แดชบอร์ด
                </a>
                <a href="finance.html"
                    class="flex items-center gap-3 p-3 text-gray-500 hover:bg-gray-50 rounded-xl transition text-2xl">
                    <span class="w-10 h-10 flex items-center justify-center shrink-0"><img src="main/finance.png"
                            class="w-9 h-9 object-contain"></span> การเงิน
                </a>
                <a href="cars.html"
                    class="flex items-center gap-3 p-3 text-gray-500 hover:bg-gray-50 rounded-xl transition text-2xl">
                    <span class="w-10 h-10 flex items-center justify-center shrink-0"><img src="main/car.png"
                            class="w-9 h-9 object-contain"></span> รถยนต์
                </a>
                <a href="customers.html"
                    class="flex items-center gap-3 p-3 text-gray-500 hover:bg-gray-50 rounded-xl transition text-2xl">
                    <span class="w-10 h-10 flex items-center justify-center shrink-0"><img src="main/group.png"
                            class="w-9 h-9 object-contain"></span> ลูกค้า
                </a>
                <a href="workorders.html"
                    class="sidebar-active flex items-center gap-3 p-3 text-gray-500 hover:bg-gray-50 rounded-xl transition text-2xl">
                    <span class="w-10 h-10 flex items-center justify-center shrink-0"><img
                            src="main/shopping-list (1).png" class="w-9 h-9 object-contain"></span> ใบสั่งซ่อม
                </a>
                <a href="inventory.html"
                    class="flex items-center gap-3 p-3 text-gray-500 hover:bg-gray-50 rounded-xl transition text-2xl">
                    <span class="w-10 h-10 flex items-center justify-center shrink-0"><img src="main/stock.png"
                            class="w-9 h-9 object-contain"></span> คลังสินค้า
                </a>
            </nav>
        </div>
    </aside>

    <main class="flex-1 lg:ml-80 pt-0 pl-0 pr-0 pb-10 w-full overflow-x-hidden">

        <header class="w-full relative mb-8">
            <div
                class="relative z-10 bg-white/90 backdrop-blur-md p-6 lg:p-8 border-b border-gray-200 shadow-lg flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-4 w-full md:w-auto">
                    <button onclick="toggleSidebar()"
                        class="lg:hidden bg-white p-2 rounded-lg border shadow-sm text-gray-600">☰</button>
                    <div>
                        <h2 class="text-2xl lg:text-3xl font-bold text-gray-800">ใบสั่งซ่อม (Work Orders)</h2>
                        <p class="text-gray-500 text-lg lg:text-xl mt-1 font-medium">จัดการงานซ่อมและบริการลูกค้า</p>
                    </div>
                </div>

                <div class="flex items-center gap-4 w-full md:w-auto justify-between md:justify-end">
                    <button onclick="openModal()"
                        class="bg-green-600 text-white px-4 lg:px-6 py-3 rounded-xl font-bold text-lg lg:text-xl flex items-center gap-2 hover:bg-green-700 transition shadow-lg active:scale-95">
                        <span>+ สร้างใบสั่งซ่อม</span>
                    </button>
                    <div class="flex items-center gap-3">
                        <div class="text-right hidden sm:block">
                            <p class="text-lg lg:text-xl font-bold text-gray-800">สมชาย มั่นคง</p>
                            <p class="text-[17px] text-gray-400 font-medium">เจ้าของอู่</p>
                        </div>
                        <div
                            class="w-12 h-12 lg:w-14 lg:h-14 rounded-full border-4 border-white shadow-md bg-red-300 flex items-center justify-center text-white font-bold text-xl uppercase">
                            SM</div>
                    </div>
                </div>
            </div>
        </header>

        <div class="px-4 lg:px-10">
            <div
                class="bg-white p-4 lg:p-6 rounded-2xl border border-gray-100 shadow-sm mb-6 flex flex-col lg:flex-row justify-between items-stretch lg:items-center gap-4">
                <div class="relative w-full max-w-md">
                    <span class="absolute inset-y-0 left-3 flex items-center text-gray-400">
                        <img src="main/search.png" class="w-5 h-5">
                    </span>
                    <input type="text" id="woSearch" placeholder="ค้นหาเลขที่, รถยนต์ หรือ ลูกค้า..."
                        class="text-lg lg:text-xl w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-green-400 outline-none transition-all">
                </div>

                <div class="flex flex-wrap gap-2 lg:gap-3">
                    <select id="statusFilter"
                        class="flex-1 lg:flex-none px-3 py-2.5 text-lg lg:text-xl bg-white border border-gray-200 rounded-xl text-gray-600 outline-none focus:ring-2 focus:ring-green-400 cursor-pointer">
                        <option value="all">สถานะทั้งหมด</option>
                        <option value="เสร็จสิ้น">เสร็จสิ้น</option>
                        <option value="กำลังดำเนินการ">กำลังดำเนินการ</option>
                        <option value="รอดำเนินการ">รอดำเนินการ</option>
                    </select>
                    <button onclick="exportToExcel()"
                        class="flex-1 lg:flex-none flex justify-center items-center gap-2 px-4 py-2.5 border border-gray-200 rounded-xl text-gray-600 hover:bg-gray-50 transition text-lg lg:text-xl font-medium">
                        <img src="main/excel.png" class="w-5 h-5 object-contain">
                        <span>Excel</span>
                    </button>
                </div>
            </div>

            <div class="bg-white rounded-2xl border border-gray-300 shadow-sm overflow-hidden">
                <div class="overflow-x-auto w-full">
                    <table class="w-full text-center min-w-[1200px]">
                        <thead class="bg-gray-300 text-gray-800 text-xl uppercase font-bold">
                            <tr>
                                <th class="px-6 py-4 font-medium text-left pl-10">เลขที่</th>
                                <th class="px-6 py-4">รถยนต์</th>
                                <th class="px-6 py-4">ลูกค้า</th>
                                <th class="px-6 py-4 text-left">รายการซ่อม</th>
                                <th class="px-6 py-4">ราคาโดยประมาณ</th>
                                <th class="px-6 py-4">สถานะ</th>
                                <th class="px-6 py-4">ล่าสุด</th>
                            </tr>
                        </thead>
                        <tbody id="workOrderTableBody" class="divide-y divide-gray-100 text-gray-700">
                        </tbody>
                    </table>
                </div>

                <div
                    class="px-6 py-4 bg-gray-50 flex flex-col sm:flex-row justify-between items-center gap-4 text-sm text-gray-500 border-t border-gray-100">
                    <p id="rowCountDisplay" class="text-xl font-medium text-gray-500">กำลังโหลดรายการ...</p>
                    <div class="flex gap-1" id="paginationControls"></div>
                </div>
            </div>
        </div>
    </main>

    <div id="addWOModal"
        class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
        <div id="modalContent"
            class="bg-white w-full max-w-2xl rounded-[2rem] shadow-2xl overflow-hidden p-8 scale-95 opacity-0 transition-all duration-200">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold text-gray-800">สร้างใบสั่งซ่อมใหม่</h3>
                <button onclick="closeModal()" class="text-gray-400 text-3xl hover:text-gray-600">&times;</button>
            </div>
            <form id="addWOForm" class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-700 font-bold mb-1">รถยนต์ (รุ่น)</label>
                    <input type="text" name="car" required placeholder="เช่น 2020 Toyota Camry"
                        class="w-full px-4 py-2 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-green-400">
                </div>
                <div>
                    <label class="block text-gray-700 font-bold mb-1">ชื่อลูกค้า</label>
                    <input type="text" name="customer" required placeholder="ชื่อ-นามสกุล"
                        class="w-full px-4 py-2 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-green-400">
                </div>
                <div class="col-span-2">
                    <label class="block text-gray-700 font-bold mb-1">รายการซ่อม/บริการ</label>
                    <textarea name="tasks" required placeholder="ระบุอาการหรือรายการอะไหล่"
                        class="w-full px-4 py-2 rounded-xl border border-gray-200 outline-none h-24 focus:ring-2 focus:ring-green-400"></textarea>
                </div>
                <div>
                    <label class="block text-gray-700 font-bold mb-1">ราคาโดยประมาณ (฿)</label>
                    <input type="number" name="price" required placeholder="0.00"
                        class="w-full px-4 py-2 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-green-400">
                </div>
                <div>
                    <label class="block text-gray-700 font-bold mb-1">สถานะเริ่มต้น</label>
                    <select name="status"
                        class="w-full px-4 py-2 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-green-400">
                        <option>รอดำเนินการ</option>
                        <option>กำลังดำเนินการ</option>
                    </select>
                </div>
                <button type="submit"
                    class="col-span-2 mt-4 py-3 bg-green-600 text-white rounded-xl font-bold text-xl hover:bg-green-700 transition shadow-lg active:scale-95">บันทึกใบสั่งซ่อม</button>
            </form>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('sidebar-hidden');
            overlay.classList.toggle('hidden');
        }

        const allWorkOrders = [
            { id: 'WO-2024-001', car: '2020 Toyota Camry', customer: 'John Smith', tasks: 'Oil Change & Tire Rotation', price: 125, status: 'เสร็จสิ้น', date: '25-11-2025' },
            { id: 'WO-2024-002', car: '2019 Honda Civic', customer: 'Sarah Johnson', tasks: 'Brake Pad Replacement', price: 350, status: 'กำลังดำเนินการ', date: '25-11-2025' },
            { id: 'WO-2024-003', car: '2021 Ford F-150', customer: 'Mike Wilson', tasks: 'Engine Diagnostic', price: 450, status: 'รอดำเนินการ', date: '26-11-2025' },
            { id: 'WO-2024-004', car: '2022 Chevrolet Silverado', customer: 'Emily Brown', tasks: 'Air Conditioning Service', price: 200, status: 'เสร็จสิ้น', date: '26-11-2025' },
            { id: 'WO-2024-005', car: '2023 BMW Series 5', customer: 'สมชาย ใจดี', tasks: 'Transmission Repair', price: 1200, status: 'กำลังดำเนินการ', date: '27-01-2026' },
            { id: 'WO-2024-006', car: '2022 Tesla Model 3', customer: 'มานะ มานี', tasks: 'Battery Check', price: 0, status: 'รอดำเนินการ', date: '20-01-2026' }
        ];

        let currentPage = 1;
        const rowsPerPage = 4;

        function openModal() {
            const modal = document.getElementById('addWOModal');
            const content = document.getElementById('modalContent');
            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('addWOModal');
            const content = document.getElementById('modalContent');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); }, 200);
        }

        document.getElementById('addWOForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const newID = 'WO-2024-00' + (allWorkOrders.length + 1);
            const newWO = {
                id: newID,
                car: this.car.value,
                customer: this.customer.value,
                tasks: this.tasks.value,
                price: parseInt(this.price.value),
                status: this.status.value,
                date: new Date().toLocaleDateString('th-TH')
            };
            allWorkOrders.unshift(newWO);
            currentPage = 1;
            renderTable(1);
            closeModal();
            this.reset();
            alert('สร้างใบสั่งซ่อม ' + newID + ' สำเร็จ!');
        });

        function renderTable(page) {
            const search = document.getElementById('woSearch').value.toLowerCase();
            const statusVal = document.getElementById('statusFilter').value;

            const filtered = allWorkOrders.filter(wo => {
                const matchesSearch = wo.id.toLowerCase().includes(search) || wo.car.toLowerCase().includes(search) || wo.customer.toLowerCase().includes(search);
                const matchesStatus = statusVal === 'all' || wo.status === statusVal;
                return matchesSearch && matchesStatus;
            });

            const start = (page - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const paginated = filtered.slice(start, end);
            const tbody = document.getElementById('workOrderTableBody');
            tbody.innerHTML = '';

            paginated.forEach(wo => {
                const badgeColor = wo.status === 'เสร็จสิ้น' ? 'bg-green-100 text-green-600' : (wo.status === 'กำลังดำเนินการ' ? 'bg-blue-100 text-blue-600' : 'bg-yellow-100 text-yellow-600');
                tbody.innerHTML += `
                    <tr class="hover:bg-green-50 transition cursor-pointer">
                        <td class="px-6 py-4 text-left pl-10 font-bold text-gray-800">${wo.id}</td>
                        <td class="px-6 py-4">${wo.car}</td>
                        <td class="px-6 py-4">${wo.customer}</td>
                        <td class="px-6 py-4 text-left text-sm text-gray-500">${wo.tasks}</td>
                        <td class="px-6 py-4 font-bold">฿${wo.price.toLocaleString()}</td>
                        <td class="px-6 py-4"><span class="px-3 py-1 rounded-full text-lg font-bold ${badgeColor}">${wo.status}</span></td>
                        <td class="px-6 py-4 text-sm">${wo.date}</td>
                    </tr>
                `;
            });

            renderPagination(filtered.length);
            document.getElementById('rowCountDisplay').innerText = `แสดง ${filtered.length > 0 ? start + 1 : 0} ถึง ${Math.min(end, filtered.length)} จาก ${filtered.length} รายการ`;
        }

        function renderPagination(totalItems) {
            const pageCount = Math.ceil(totalItems / rowsPerPage);
            const controls = document.getElementById('paginationControls');
            controls.innerHTML = '';
            if (pageCount <= 1) return;

            const createBtn = (text, active, onClick) => {
                const btn = document.createElement('button');
                btn.innerText = text;
                btn.className = `px-4 py-1 border border-gray-200 rounded-lg transition text-xl ${active ? 'page-active' : 'hover:bg-white'}`;
                btn.onclick = onClick;
                return btn;
            };

            controls.appendChild(createBtn('ย้อนกลับ', false, () => { if (currentPage > 1) { currentPage--; renderTable(currentPage); } }));
            for (let i = 1; i <= pageCount; i++) {
                controls.appendChild(createBtn(i, i === currentPage, () => { currentPage = i; renderTable(i); }));
            }
            controls.appendChild(createBtn('ถัดไป', false, () => { if (currentPage < pageCount) { currentPage++; renderTable(currentPage); } }));
        }

        // --- ฟังก์ชันส่งออก Excel (CSV) ---
        function exportToExcel() {
            if (allWorkOrders.length === 0) {
                alert("ไม่มีข้อมูลสำหรับส่งออก");
                return;
            }

            let csvContent = "\uFEFF"; // ใส่ BOM เพื่อให้อ่านภาษาไทยใน Excel ได้
            csvContent += "เลขที่ใบสั่งซ่อม,รถยนต์,ลูกค้า,รายการซ่อม,ราคาโดยประมาณ,สถานะ,วันที่\n";

            allWorkOrders.forEach(wo => {
                let row = `"${wo.id}","${wo.car}","${wo.customer}","${wo.tasks.replace(/\n/g, ' ')}",${wo.price},"${wo.status}","${wo.date}"`;
                csvContent += row + "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", "ใบสั่งซ่อม_BTAutoService.csv");
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        document.getElementById('woSearch').addEventListener('keyup', () => { currentPage = 1; renderTable(1); });
        document.getElementById('statusFilter').addEventListener('change', () => { currentPage = 1; renderTable(1); });

        renderTable(1);
    </script>
</body>

</html>
